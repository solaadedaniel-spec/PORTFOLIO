<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sola | Multidisciplinary art director</title>
  <meta name="description" content="Sola is a multidisciplinary art director based in Nigeria, shaping brands across design, advertising, fashion and photography.">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <meta name="theme-color" content="#0e0e0d">

  <!-- Link preview when the site is shared (WhatsApp, LinkedIn, X, iMessage) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sola">
  <meta property="og:title" content="Sola | Multidisciplinary art director">
  <meta property="og:description" content="Nothing much, just real good stuff. Selected work across design, advertising, fashion and photography.">
  <meta property="og:url" content="https://solaadedaniel-spec.github.io/PORTFOLIO/">
  <meta property="og:image" content="https://solaadedaniel-spec.github.io/PORTFOLIO/images/share.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Baru, Age of Bronze: the Matriarch in a red headpiece and robe">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>

  <header class="nav wrap">
    <a class="nav__name" href="#top" data-text="name"></a>
    <nav aria-label="Main">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
      <a id="nav-linkedin" class="nav__linkedin" target="_blank" rel="noopener">LinkedIn</a>
    </nav>
  </header>

  <!-- HOME -->
  <main id="home">
    <span id="top"></span>

    <!-- INTRO (full width, so the picture trail can use all the black space) -->
    <section class="hero-stage" id="hero-stage">
      <div class="hero wrap">
        <p class="eyebrow load" data-text="welcome"></p>
        <h1 class="hero__statement load">
          <span class="hero__name" data-text="name"></span> <span data-text="statement"></span>
          <span class="sr-only" data-text="disciplinesText"></span>
          <span class="rotator" id="rotator" aria-hidden="true"></span>
        </h1>
        <p class="hero__tagline load" data-text="tagline"></p>
      </div>
    </section>

    <!-- BRANDS -->
    <div class="brands load" aria-label="Brands I have worked with">
      <ul class="brands__track" id="brands"></ul>
    </div>

    <!-- SELECTED WORK -->
    <section id="work" class="work wrap">
      <div class="filters" id="filters" role="group" aria-label="Filter work by discipline"></div>
      <div class="work__grid" id="work-grid"></div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="about wrap">
      <figure class="about__portrait reveal">
        <img id="portrait" alt="" loading="lazy" width="900" height="1100">
      </figure>
      <div class="about__text">
        <h2 class="section-title reveal">About</h2>
        <div id="bio" class="about__bio"></div>
        <p class="about__location reveal" data-text="location"></p>
      </div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="services wrap">
      <h2 class="section-title reveal">Services</h2>
      <ul id="services-list" class="services__list"></ul>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact wrap">
      <h2 class="contact__headline reveal" data-text="contactHeadline"></h2>
      <a class="contact__email reveal" data-email></a>
    </section>
  </main>

  <!-- PROJECT PAGE (shown when a project is opened) -->
  <main id="project" class="project" hidden>
    <div class="wrap">
      <a class="project__back" href="#work">&larr; All work</a>
      <p class="project__meta" id="project-meta"></p>
      <h1 class="project__headline" id="project-headline"></h1>
      <p class="project__desc" id="project-desc"></p>
      <p class="project__role" id="project-role"></p>
    </div>
    <div class="project__media" id="project-media"></div>
    <div class="wrap project__next">
      <span>Next project</span>
      <a id="project-next"></a>
    </div>
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <div class="footer__links" id="footer-links"></div>
      <p>&copy; <span id="year"></span> <span data-text="name"></span>. <span data-text="location"></span>.</p>
    </div>
  </footer>

  <noscript><p class="wrap">Please enable JavaScript to view this portfolio.</p></noscript>

  <script src="content.js?v=8"></script>
  <script src="main.js?v=8"></script>
</body>
</html>
